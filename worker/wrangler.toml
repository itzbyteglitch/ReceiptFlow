name = "receiptflow-api"
main = "src/index.ts"
compatibility_date = "2026-08-28"

[vars]
OPENROUTER_MODEL = "openrouter/free"

[[d1_databases]]
binding = "DB"
database_name = "receiptflow-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "receiptflow-temp"

[triggers]
crons = ["*/15 * * * *"]
